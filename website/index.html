<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTCUSDT Chart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>BTCUSDT Chart</h1>
    
    <div id="timeframe-buttons">
        <button data-interval="1m">1m</button>
        <button data-interval="5m">5m</button>
        <button data-interval="15m">15m</button>
        <button data-interval="30m">30m</button>
        <button data-interval="1h">1h</button>
        <button data-interval="4h">4h</button>
        <button data-interval="1d">1d</button>
        <button data-interval="1M">1M</button>
    </div>

    <div id="chart-container"></div>
    <button id="draw-line-btn">Draw a Line</button>

    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
    <script src="script.js"></script>
    <script src="order_book.js"></script>
</body>
</html>
